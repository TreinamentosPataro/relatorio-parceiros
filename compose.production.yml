name: partner-reports

x-app: &app
  image: ${APP_IMAGE:?Defina APP_IMAGE com tag ou digest imutável}
  env_file:
    - ${PARTNER_REPORTS_ENV_FILE:-./deploy/production.env}
  read_only: true
  tmpfs:
    - /tmp:size=512m,mode=1777
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  volumes:
    - pdf_sources:/data/sources
    - report_artifacts:/data/reports
  networks: [backend]

services:
  proxy:
    image: ${CADDY_IMAGE:?Defina CADDY_IMAGE com tag ou digest imutável}
    restart: unless-stopped
    env_file:
      - ${PARTNER_REPORTS_ENV_FILE:-./deploy/production.env}
    ports:
      - "80:80"
      - "443:443"
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /config:size=16m,mode=0700
      - /tmp:size=16m,mode=1777
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks: [edge, ingress]
    depends_on:
      app:
        condition: service_healthy

  app:
    <<: *app
    restart: unless-stopped
    expose: ["8000"]
    environment:
      # Only the proxy shares `ingress`; X-Forwarded-For is trusted from nowhere else.
      FORWARDED_ALLOW_IPS: ${INGRESS_SUBNET:-10.254.18.0/29}
    networks: [backend, ingress]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s

  migrate:
    <<: *app
    profiles: ["operations"]
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    <<: *app
    profiles: ["operations"]
    env_file:
      - ${PARTNER_REPORTS_ENV_FILE:-./deploy/production.env}
      - path: ${ADVBOX_ENV_FILE:-./deploy/advbox.env}
        required: false
    command: ["python", "-m", "partner_reports.jobs.automation_cli", "drain", "--output-root", "/data/reports"]
    networks: [backend, outbound]
    depends_on:
      postgres:
        condition: service_healthy

  retention:
    <<: *app
    profiles: ["operations"]
    command: ["python", "-m", "partner_reports.retention", "--execute"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: ${POSTGRES_IMAGE:?Defina POSTGRES_IMAGE com tag ou digest imutável}
    restart: unless-stopped
    env_file:
      - ${PARTNER_REPORTS_ENV_FILE:-./deploy/production.env}
    expose: ["5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backup:
    profiles: ["backup"]
    image: ${BACKUP_IMAGE:?Defina BACKUP_IMAGE com tag ou digest imutável}
    env_file:
      - ${PARTNER_REPORTS_ENV_FILE:-./deploy/production.env}
      - ${RESTIC_ENV_FILE:-./deploy/restic.env}
    environment:
      HOME: /work
      RESTIC_CACHE_DIR: /work/cache
      TMPDIR: /work
    read_only: true
    tmpfs:
      - /work:size=1g,uid=10001,gid=10001,mode=0700
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - pdf_sources:/data/sources:ro
      - report_artifacts:/data/reports:ro
      - ${RESTIC_CONFIG_DIR:?Defina RESTIC_CONFIG_DIR}:/run/restic:ro
    networks: [backend, outbound]
    depends_on:
      postgres:
        condition: service_healthy

  restore-postgres:
    profiles: ["restore-test"]
    image: ${POSTGRES_IMAGE:?Defina POSTGRES_IMAGE com tag ou digest imutável}
    env_file:
      - ${PARTNER_REPORTS_ENV_FILE:-./deploy/production.env}
    volumes:
      - restore_postgres_data:/var/lib/postgresql/data
    networks: [restore]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 60s

  restore-test:
    profiles: ["restore-test"]
    image: ${BACKUP_IMAGE:?Defina BACKUP_IMAGE com tag ou digest imutável}
    entrypoint: ["/usr/local/bin/partner-reports-restore-test"]
    env_file:
      - ${PARTNER_REPORTS_ENV_FILE:-./deploy/production.env}
      - ${RESTIC_ENV_FILE:-./deploy/restic.env}
    environment:
      HOME: /restore
      PGHOST: restore-postgres
      RESTIC_CACHE_DIR: /restore/cache
      TMPDIR: /restore
    read_only: true
    tmpfs:
      - /restore:size=2g,uid=10001,gid=10001,mode=0700
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ${RESTIC_CONFIG_DIR:?Defina RESTIC_CONFIG_DIR}:/run/restic:ro
    networks: [restore, outbound]
    depends_on:
      restore-postgres:
        condition: service_healthy

networks:
  edge:
  ingress:
    internal: true
    ipam:
      config:
        - subnet: ${INGRESS_SUBNET:-10.254.18.0/29}
  backend:
    internal: true
  restore:
    internal: true
  outbound:

volumes:
  postgres_data:
  pdf_sources:
  report_artifacts:
  caddy_data:
  restore_postgres_data:
