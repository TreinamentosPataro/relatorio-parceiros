services:
  app:
    build:
      context: .
      target: development
    environment:
      APP_ENV: ${APP_ENV:?Defina APP_ENV no arquivo .env}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Defina POSTGRES_USER}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Defina POSTGRES_DB}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONPATH: /app/src
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    profiles: ["automation"]
    build:
      context: .
      target: development
    command: ["python", "-m", "partner_reports.jobs.automation_cli", "worker-loop"]
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:?Defina APP_ENV no arquivo .env}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Defina POSTGRES_USER}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Defina POSTGRES_DB}
      PYTHONPATH: /app/src
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
